[project]
name = "morphorum"
version = "0.1.0a1"
description = "Standalone AI image and animation studio with Deforum-style compatibility."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Unlicense" }
authors = [{ name = "Morphorum contributors" }]
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37,<1",
  "httpx>=0.28,<1",
  "psutil>=7,<8",
  "PyYAML>=6,<7",
  "diffusers==0.40.0",
  "transformers>=5,<6",
  "accelerate>=1,<2",
  "safetensors>=0.8,<1",
  "Pillow>=10,<16",
  "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
morphorum = "morphorum.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
