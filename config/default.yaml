app:
  name: Morphorum
  version_file: VERSION

server:
  host: 127.0.0.1
  port: 7865
  allow_lan: false
  access_token: ""

ui:
  theme: midnight-glass
  font_style: modern
  mono_font_style: modern-mono
  ui_scale: compact
  interface_mode: simple
  remember_collapsed_cards: true
  image_preview_limit: 5

models:
  sdxl:
    label: SDXL
    checkpoints: []
    loras: []
  flux:
    label: Flux
    checkpoints: []
    loras: []
  zimage:
    label: Z-Image
    loras: []
  shared:
    vae: []
    embeddings: []
    controlnet: []

scan:
  recursive: true
  cache_metadata: true
  hash_new_files: true

performance:
  profile: auto
  keep_model_loaded: true
  unload_after_generation: false
  sdxl_vae_tiling: false
  unload_after_minutes: 0

managed_models:
  locations:
    zimage: .\ckpts\z-image

paths:
  projects: projects
  outputs: outputs
  cache: cache
  logs: logs
  backups: backups

output:
  directory: outputs
  image_format: png

updates:
  channel: stable
