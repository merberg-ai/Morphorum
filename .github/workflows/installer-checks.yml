name: Installer checks

on:
  push:
    branches: [main, dev-ui]
    paths:
      - 'scripts/**'
      - '*.sh'
      - '*.bat'
      - '.github/workflows/installer-checks.yml'
  # Every PR must report this check before branch protection can require it.
  pull_request:

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.FullName):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test standalone bootstrap.bat via real Windows CMD
        shell: pwsh
        env:
          MORPHORUM_BOOTSTRAP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'morphorum-standalone-bat-smoke'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item bootstrap.bat (Join-Path $target 'bootstrap.bat') -Force
          # Running outside the checkout forces the remote PS1 download
          # and catches CMD expansion failures that a PowerShell parser misses.
          $output = & (Join-Path $target 'bootstrap.bat') -Help 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Standalone bootstrap.bat exited $LASTEXITCODE" }
          if ($output -notmatch 'MORPHORUM - WINDOWS INSTALLER') {
            throw 'The downloaded bootstrap script did not run its help page.'
          }
          if ($output -match "Processing -File|StatusCode\s+:\s+200") {
            throw 'Unexpected PowerShell download output or empty -File path.'
          }

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse shell scripts
        run: |
          set -e
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find . -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
