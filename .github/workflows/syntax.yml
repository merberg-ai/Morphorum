name: Syntax checks

on:
  push:
    branches: [main, dev-ui, dev-webui, feature/civitai-model-hub]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Validate public documentation
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest tests/test_documentation.py tests/test_ffmpeg_tools.py tests/test_managed_ffmpeg.py tests/test_ffmpeg_acceptance.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser JavaScript syntax
        run: |
          node --check frontend/dist/assets/ui-services.js
          node --check frontend/dist/assets/app.js
          node --check frontend/dist/assets/about.js
          node --check frontend/dist/assets/first-run-setup.js
          node --check frontend/dist/assets/civitai.js
          node --check frontend/dist/assets/models.js
          node --check frontend/dist/assets/library-thumbnails.js
          node --check frontend/dist/assets/image.js
          node --check frontend/dist/assets/loras.js
          node --check frontend/dist/assets/project-wizard.js
          node --check frontend/dist/assets/prompt-studio-bridge.js
          node --check frontend/dist/assets/prompt-studio.js
          node --check frontend/dist/assets/animation.js
          node --check frontend/dist/assets/motion-lab-recording.js
          node --check frontend/dist/assets/motion-lab-frame-player.js

      - name: Regression-test Prompt Studio editor bridge and manual workspace
        run: node --test tests/frontend_prompt_studio_bridge.test.cjs tests/frontend_prompt_studio_workspace.test.cjs

      - name: Regression-test browser LoRA prompt insertion
        run: node --test tests/frontend_cached_art.test.cjs tests/frontend_about.test.cjs tests/frontend_lora_insertion.test.cjs tests/frontend_animation_cadence.test.cjs tests/frontend_animation_video.test.cjs tests/frontend_deforum_import.test.cjs tests/frontend_deforum_motion_workspace.test.cjs tests/frontend_deforum_layout.test.cjs tests/frontend_shared_ui.test.cjs tests/frontend_dev_ui.test.cjs tests/frontend_appearance.test.cjs tests/frontend_motion_lab_navigation.test.cjs tests/frontend_project_wizard.test.cjs tests/frontend_public_copy.test.cjs tests/frontend_resolution_presets.test.cjs tests/frontend_responsive_styles.test.cjs tests/frontend_project_media_restore.test.cjs tests/frontend_audio_waveform.test.cjs tests/frontend_audio_layout.test.cjs tests/frontend_audio_marker_editor.test.cjs tests/frontend_audio_motion_director.test.cjs tests/frontend_audio_find_beats.test.cjs tests/frontend_motion_studio_channels.test.cjs tests/frontend_motion_studio_spectrum.test.cjs tests/frontend_project_soundtrack_reuse.test.cjs tests/frontend_motion_studio_arrangement.test.cjs tests/frontend_motion_studio_audio_source_layout.test.cjs tests/frontend_motion_lab_recording.test.cjs tests/frontend_motion_lab_frame_player.test.cjs tests/frontend_motion_render_review.test.cjs tests/frontend_motion_refinement.test.cjs tests/frontend_motion_playback_polish.test.cjs tests/frontend_first_run_setup.test.cjs tests/frontend_p4_operation_feedback.test.cjs tests/frontend_p43_feedback.test.cjs tests/frontend_ffmpeg_manager.test.cjs tests/frontend_motion_studio_workflow_ux.test.cjs tests/frontend_motion_studio_analysis_feedback.test.cjs tests/frontend_motion_studio_preview_matches.test.cjs
