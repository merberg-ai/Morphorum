name: Syntax checks

on:
  push:
    branches: [main, dev-ui, dev-webui]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Validate public documentation
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest tests/test_documentation.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser JavaScript syntax
        run: |
          node --check frontend/dist/assets/ui-services.js
          node --check frontend/dist/assets/app.js
          node --check frontend/dist/assets/models.js
          node --check frontend/dist/assets/image.js
          node --check frontend/dist/assets/loras.js
          node --check frontend/dist/assets/project-wizard.js
          node --check frontend/dist/assets/animation.js

      - name: Regression-test browser LoRA prompt insertion
        run: node --test tests/frontend_lora_insertion.test.cjs tests/frontend_animation_cadence.test.cjs tests/frontend_animation_video.test.cjs tests/frontend_deforum_import.test.cjs tests/frontend_deforum_motion_workspace.test.cjs tests/frontend_deforum_layout.test.cjs tests/frontend_shared_ui.test.cjs tests/frontend_dev_ui.test.cjs tests/frontend_appearance.test.cjs tests/frontend_motion_lab_navigation.test.cjs tests/frontend_project_wizard.test.cjs tests/frontend_public_copy.test.cjs tests/frontend_resolution_presets.test.cjs tests/frontend_responsive_styles.test.cjs tests/frontend_project_media_restore.test.cjs tests/frontend_audio_waveform.test.cjs tests/frontend_audio_layout.test.cjs tests/frontend_audio_marker_editor.test.cjs tests/frontend_audio_motion_director.test.cjs tests/frontend_audio_find_beats.test.cjs tests/frontend_motion_studio_channels.test.cjs
