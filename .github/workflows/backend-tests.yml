name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Create virtual environment
        run: uv venv --python 3.12 .venv

      - name: Install CPU PyTorch
        run: uv pip install --python .venv/bin/python 'torch==2.14.0' 'torchvision==0.29.0' --index-url https://download.pytorch.org/whl/cpu

      - name: Install Morphorum and test tools
        run: |
          uv pip install --python .venv/bin/python --editable .
          uv pip install --python .venv/bin/python 'pytest>=8,<10'

      - name: Run tests
        run: .venv/bin/python -m pytest

      - name: Run Morphorum self-test
        run: .venv/bin/python -m morphorum self-test
